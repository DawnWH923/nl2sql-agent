name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest sqlglot
      - name: Run guard unit tests
        run: pytest tests/ -v
      - name: Syntax check all modules
        run: python -m py_compile agent.py guard.py sandbox.py tools.py api.py
